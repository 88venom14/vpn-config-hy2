mixed-port: 7890
allow-lan: false
tcp-concurrent: true
mode: rule
log-level: info
ipv6: false
keep-alive-interval: 30
unified-delay: false

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
        - 80
        - 8080-8880
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
      override-destination: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  strict-route: true
  mtu: 1500

dns:
  enable: true
  prefer-h3: true
  use-hosts: true
  use-system-hosts: true
  listen: 127.0.0.1:6868
  ipv6: false
  enhanced-mode: fake-ip

  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - localhost.ptlogin2.qq.com
    - "*.telegram.org"
    - "*.t.me"

  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  proxy-server-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  direct-nameserver:
    - 1.1.1.1
    - 8.8.8.8

  nameserver:
    - https://cloudflare-dns.com/dns-query

proxies:
  - name: "YOUR_PROXY_NAME"
    type: hysteria2
    server: YOUR_SERVER
    port: 4433
    password: "YOUR_PASSWORD"
    sni: YOUR_SNI
    skip-cert-verify: false

proxy-groups:

  # ==================================================
  # ОСНОВНОЙ VPN-МАРШРУТ
  # ==================================================

  - name: "🌍 VPN"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Hijacking.png"
    type: select
    proxies:
      - "YOUR_PROXY_NAME"
    default-selected: "YOUR_PROXY_NAME"

  # ==================================================
  # ОБЩИЙ ПЕРЕКЛЮЧАТЕЛЬ
  # ==================================================

  - name: "🌐 GLOBAL"
    type: select
    proxies:
      - "🌍 VPN"
      - DIRECT
    default-selected: "🌍 VPN"

  # ==================================================
  # SPOTIFY
  # ==================================================

  - name: "Spotify"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png"
    type: select
    proxies:
      - DIRECT
      - "🌍 VPN"
    default-selected: DIRECT

  # ==================================================
  # TELEGRAM
  # ==================================================

  - name: "Telegram"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png"
    type: select
    proxies:
      - "🌍 VPN"
      - DIRECT
    default-selected: "🌍 VPN"

  # ==================================================
  # TIKTOK
  # ==================================================

  - name: "TikTok"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TikTok.png"
    type: select
    proxies:
      - "🌍 VPN"
      - DIRECT
    default-selected: "🌍 VPN"

  # ==================================================
  # APPLE
  # ==================================================

  - name: "Apple"
    icon: "https://cdn.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png"
    type: select
    proxies:
      - DIRECT
      - "🌍 VPN"
    default-selected: DIRECT

  # ==================================================
  # РОССИЯ
  # ==================================================

  - name: "🇷🇺 Россия"
    type: select
    proxies:
      - DIRECT
      - "🌍 VPN"
    default-selected: DIRECT

  # ==================================================
  # TORRENTS
  # ==================================================

  - name: "⬇️ Torrents"
    type: select
    proxies:
      - DIRECT
      - "🌍 VPN"
    default-selected: DIRECT

rule-providers:

  # --------------------------------------------------
  # РОССИЯ
  # --------------------------------------------------

  ru-inline-banned:
    type: http
    url: https://github.com/legiz-ru/mihomo-rule-sets/raw/main/other/inline/ru-inline-banned.yaml
