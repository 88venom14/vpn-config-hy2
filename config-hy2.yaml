  - RULE-SET,ru-inline,🇷🇺 Россия
  - RULE-SET,ru-app-list,🇷🇺 Россия

  # ==================================================
  # PRIVATE / LOCAL
  # ==================================================

  - RULE-SET,geosite-private,DIRECT,no-resolve
