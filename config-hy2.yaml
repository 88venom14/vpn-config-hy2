  # ==================================================
  # СИСТЕМНЫЕ / СПЕЦИАЛЬНЫЕ
  # ==================================================

  - RULE-SET,xiaomi,DIRECT
  - RULE-SET,blender,DIRECT
  - RULE-SET,drweb,DIRECT
  - RULE-SET,debian,DIRECT
  - RULE-SET,canonical,DIRECT
  - RULE-SET,python,DIRECT

  # ==================================================
